/* Layout: two shells on one page. The SITE shell (Home, Product, Security, FAQ) is a 1200px editorial column
   over a slow aurora canvas. The APP shell (Wallet, Best card, Insights, Import, Cards) is a sidebar + workspace
   on desktop and a bottom tab bar on phones. Routes switch with view transitions. */
:root {
  --night: #080B14;
  --bg: #0B0E18;
  --surface: #131828;
  --surface-2: #1A2034;
  --surface-3: #222941;
  --line: #262D44;
  --line-soft: #1B2132;
  --cream: #ECE9E2;
  --ink: #F3F0E9;
  --muted: #9AA3B8;
  --subtle: #69728C;
  --green: #6FD9A4;
  --green-bg: #11291E;
  --amber: #F5C66B;
  --amber-bg: #2B2210;
  --red: #FF9A8B;
  --violet: #A99BFF;
  --gold: #D8B96A;
  --font: "Plus Jakarta Sans", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  --ease: cubic-bezier(.2, .8, .2, 1);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; min-height: 100vh; background: var(--night); color: var(--ink); font: 400 16.5px/1.6 var(--font); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 80; background: var(--night); }
a { color: inherit; }
button, input, select { font: inherit; color: inherit; }
svg { flex: none; }
:focus-visible { outline: 2px solid var(--cream); outline-offset: 3px; border-radius: 8px; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.subtle { color: var(--subtle); }
.small { font-size: 14px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
#aurora { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; opacity: .9; }
#root { position: relative; z-index: 1; }
::view-transition-old(root), ::view-transition-new(root) { animation-duration: .35s; animation-timing-function: var(--ease); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ---------- shared controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 9px; min-height: 48px; padding: 0 22px; border-radius: 999px; border: 1px solid transparent; font-weight: 700; font-size: 16px; line-height: 1; text-decoration: none; cursor: pointer; white-space: nowrap; transition: transform .2s var(--ease), background .2s, border-color .2s, box-shadow .3s; }
.btn:active { transform: scale(.97); }
.btn[disabled] { opacity: .5; cursor: default; }
.btn-primary { background: var(--cream); color: var(--night); box-shadow: 0 10px 30px -12px rgba(236,233,226,.6); }
.btn-primary:hover:not([disabled]) { background: #fff; box-shadow: 0 14px 40px -12px rgba(236,233,226,.8); }
.btn-ghost { background: rgba(255,255,255,.03); border-color: var(--line); }
.btn-ghost:hover { border-color: var(--muted); }
.btn-danger { background: transparent; border-color: #5a2b28; color: var(--red); }
.btn-sm { min-height: 38px; padding: 0 15px; font-size: 14px; }
.link-btn { background: none; border: 0; padding: 6px 4px; color: var(--muted); font-weight: 500; font-size: 14px; cursor: pointer; }
.link-btn:hover { color: var(--ink); }
.input, .select { width: 100%; min-height: 48px; padding: 0 15px; border-radius: 14px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font-size: 16px; }
.input:focus, .select:focus { outline: none; border-color: var(--cream); }
.field { display: grid; gap: 6px; min-width: 0; }
.field label, .lbl { font-size: 13.5px; font-weight: 500; color: var(--muted); }
.panel { background: color-mix(in srgb, var(--surface) 92%, transparent); border: 1px solid var(--line); border-radius: 22px; }
.glass { background: color-mix(in srgb, var(--surface) 70%, transparent); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border: 1px solid color-mix(in srgb, var(--line) 80%, transparent); border-radius: 22px; }
.tag { display: inline-block; padding: 2px 7px; border-radius: 6px; font-size: 11px; font-weight: 700; background: var(--surface-3); color: var(--muted); vertical-align: 2px; }
.pill { display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255,255,255,.03); font-size: 13.5px; color: var(--muted); }
.pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 12px var(--green); }

/* ---------- card face ---------- */
.cardface { --mx: 30%; --my: 20%; position: relative; aspect-ratio: 85.6 / 53.98; width: 100%; border-radius: 6% / 9.5%; padding: 6.5% 7%; color: #fff; overflow: hidden; isolation: isolate; container-type: inline-size;
  background: linear-gradient(135deg, var(--c), color-mix(in srgb, var(--c) 48%, #000));
  box-shadow: 0 30px 60px -24px color-mix(in srgb, var(--c) 85%, transparent), 0 0 0 1px rgba(255,255,255,.09) inset; }
.cardface::before { content: ""; position: absolute; inset: 0; z-index: -1; background: radial-gradient(circle at 115% -15%, transparent 28%, rgba(255,255,255,.08) 28.4%, transparent 29%, transparent 38%, rgba(255,255,255,.06) 38.4%, transparent 39%, transparent 48%, rgba(255,255,255,.05) 48.4%, transparent 49%); }
.cardface::after { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at var(--mx) var(--my), rgba(255,255,255,.28), transparent 45%); mix-blend-mode: overlay; pointer-events: none; }
.cf-name { font-weight: 700; font-size: 6.2cqw; letter-spacing: .02em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 78%; }
.cf-sub { font-size: 3.6cqw; opacity: .7; letter-spacing: .06em; text-transform: uppercase; margin-top: 1.5cqw; }
.cf-chip { position: absolute; left: 7%; top: 44%; width: 13%; aspect-ratio: 1.3; border-radius: 14%; background: linear-gradient(135deg, #F3E1A8, var(--gold) 55%, #A28443); box-shadow: inset 0 0 0 1px rgba(0,0,0,.2); }
.cf-chip::after { content: ""; position: absolute; inset: 30% 0; border-block: 1px solid rgba(0,0,0,.25); }
.cf-tap { position: absolute; left: 24%; top: 45.5%; width: 7%; opacity: .85; }
.cf-num { position: absolute; left: 7%; bottom: 10%; font: 500 5.2cqw/1 var(--mono); letter-spacing: .14em; }
.cf-logo { position: absolute; right: 7%; bottom: 9%; width: 10%; opacity: .9; }
.cf-tag { position: absolute; right: 7%; top: 9%; font: 700 3.2cqw/1 var(--mono); letter-spacing: .12em; padding: 1.4cqw 2cqw; border-radius: 1.4cqw; background: rgba(255,255,255,.18); }

/* ---------- SITE shell ---------- */
.wrap { max-width: 1200px; margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.snav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; transition: background .3s, border-color .3s; border-bottom: 1px solid transparent; }
.snav.scrolled { background: color-mix(in srgb, var(--night) 78%, transparent); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-color: var(--line-soft); }
.snav .wrap { display: flex; align-items: center; gap: 30px; height: 72px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; flex: none; }
.brand b { font-weight: 900; font-size: 21px; letter-spacing: .14em; }
.slinks { display: flex; gap: 6px; }
.slinks a { padding: 8px 14px; border-radius: 999px; text-decoration: none; color: var(--muted); font-weight: 500; font-size: 15px; transition: color .2s, background .2s; }
.slinks a:hover { color: var(--ink); }
.slinks a[aria-current="page"] { color: var(--ink); background: rgba(255,255,255,.06); }
.snav-right { margin-left: auto; display: flex; gap: 10px; align-items: center; }
.menu-btn { display: none; width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: none; cursor: pointer; place-items: center; }
@media (max-width: 860px) {
  .slinks { display: none; }
  .menu-btn { display: inline-grid; }
  .snav.open { background: var(--night); }
  .snav.open .slinks { display: flex; flex-direction: column; position: absolute; top: 72px; left: 0; right: 0; background: var(--night); border-bottom: 1px solid var(--line); padding: 8px max(20px, env(safe-area-inset-right, 0px)) 18px max(20px, env(safe-area-inset-left, 0px)); }
  .snav.open .slinks a { font-size: 19px; padding: 14px 4px; border-radius: 0; border-bottom: 1px solid var(--line-soft); }
}
@media (max-width: 400px) { .snav-right .btn { padding: 0 14px; } }

.sec { padding-block: clamp(64px, 9vw, 128px); position: relative; }
.eyebrow { font-size: 14px; font-weight: 700; color: var(--green); letter-spacing: .02em; }
.h2 { font-size: clamp(34px, 5vw, 60px); font-weight: 900; letter-spacing: -0.04em; line-height: 1; }
.lede { color: var(--muted); font-size: clamp(17px, 1.9vw, 20px); max-width: 60ch; }
.head { display: grid; gap: 16px; max-width: 780px; margin-bottom: clamp(36px, 5vw, 60px); }
.head.center { margin-inline: auto; text-align: center; justify-items: center; }

/* hero */
.hero { padding-block: clamp(36px, 6vw, 80px) clamp(60px, 8vw, 110px); }
.hero .wrap { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr); gap: clamp(32px, 5vw, 72px); align-items: center; }
.hero h1 { font-size: clamp(50px, 8.4vw, 112px); font-weight: 900; letter-spacing: -0.055em; line-height: .9; margin-top: 22px; }
.shine-text { background: linear-gradient(100deg, var(--ink) 20%, var(--green) 40%, #BDF5D8 50%, var(--green) 60%, var(--ink) 80%); background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: sweep 7s var(--ease) infinite; }
@keyframes sweep { 0%, 15% { background-position: 100% 0; } 60%, 100% { background-position: 0 0; } }
.hero .lede { margin-top: 24px; }
.hero-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 34px; }
.hero-note { margin-top: 18px; font-size: 14px; color: var(--subtle); }
.stack { position: relative; aspect-ratio: 1 / .92; perspective: 1200px; }
.stack .fc { position: absolute; width: 70%; transform-style: preserve-3d; transition: transform .6s var(--ease); }
.stack .fc .inner { animation: float 7s ease-in-out infinite; }
.stack .fc:nth-child(1) { left: 0; top: 4%; --rz: -13deg; z-index: 1; }
.stack .fc:nth-child(2) { right: 0; top: 26%; --rz: 8deg; z-index: 2; }
.stack .fc:nth-child(2) .inner { animation-delay: -2.4s; }
.stack .fc:nth-child(3) { left: 13%; top: 50%; --rz: -3deg; z-index: 3; }
.stack .fc:nth-child(3) .inner { animation-delay: -4.6s; }
@keyframes float { 0%, 100% { transform: translateY(0) rotate(var(--rz)); } 50% { transform: translateY(-14px) rotate(var(--rz)); } }
.stack .glow { position: absolute; left: 10%; right: 10%; bottom: -2%; height: 22%; background: radial-gradient(closest-side, rgba(111,217,164,.22), transparent); filter: blur(10px); }
.float-chip { position: absolute; z-index: 5; display: flex; align-items: center; gap: 10px; padding: 11px 15px; font-size: 13.5px; line-height: 1.3; }
.float-chip b { display: block; font-size: 17px; font-weight: 900; }
.float-chip.a { right: -2%; top: 2%; animation: float 8s ease-in-out infinite; --rz: 0deg; }
.float-chip.b { left: -3%; bottom: 8%; animation: float 9s ease-in-out infinite -3s; --rz: 0deg; }
.dot { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; }

/* marquee */
.marquee { border-block: 1px solid var(--line-soft); overflow: hidden; padding-block: 18px; mask-image: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent); }
.marquee-track { display: flex; gap: 14px; width: max-content; animation: marquee 40s linear infinite; }
.marquee:hover .marquee-track { animation-play-state: paused; }
@keyframes marquee { to { transform: translateX(-50%); } }
.mq { display: inline-flex; align-items: center; gap: 10px; padding: 8px 16px 8px 9px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 14.5px; white-space: nowrap; }
.mq b { color: var(--green); }

/* bento */
.bento { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 16px; }
.tile { padding: 26px; display: grid; gap: 12px; align-content: start; overflow: hidden; position: relative; min-width: 0; transition: transform .4s var(--ease), border-color .3s; }
.tile:hover { transform: translateY(-4px); border-color: #39415c; }
.tile p { color: var(--muted); font-size: 15.5px; }
.t-a { grid-column: span 4; }
.t-b { grid-column: span 2; }
.t-c, .t-d, .t-e { grid-column: span 2; }
.ficon { width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center; background: var(--surface-2); border: 1px solid var(--line); }
.live-rank { display: grid; gap: 8px; margin-top: 6px; }
.lr { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; align-items: center; padding: 11px 14px; border-radius: 14px; background: var(--surface-2); transition: background .4s; }
.lr.top { background: linear-gradient(90deg, var(--green-bg), var(--surface-2)); }
.lr b { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lr span { font-weight: 900; font-variant-numeric: tabular-nums; }
.lr.top span { color: var(--green); }
.lr .bar { grid-column: 1 / -1; }
.bar { height: 6px; border-radius: 4px; background: var(--bg); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 4px; transition: width .7s var(--ease); }
.big-num { font-size: clamp(40px, 5vw, 56px); font-weight: 900; letter-spacing: -0.04em; line-height: 1; color: var(--amber); }
.mini-bars { display: flex; align-items: flex-end; gap: 8px; height: 90px; margin-top: 6px; }
.mini-bars i { flex: 1; border-radius: 6px 6px 3px 3px; background: linear-gradient(180deg, var(--c), color-mix(in srgb, var(--c) 30%, transparent)); animation: grow 1s var(--ease) both; transform-origin: bottom; }
@keyframes grow { from { transform: scaleY(.3); } }

/* steps */
.steps3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; counter-reset: s; }
.st { padding: 28px; display: grid; gap: 12px; align-content: start; }
.st .n { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: var(--cream); color: var(--night); font-weight: 900; }
.st p { color: var(--muted); }

.cta-band { padding: clamp(40px, 7vw, 80px); border-radius: 32px; text-align: center; display: grid; justify-items: center; gap: 18px; background: radial-gradient(700px 360px at 50% 0%, rgba(111,217,164,.18), transparent 70%), var(--surface); border: 1px solid var(--line); }

/* product scrolly */
.scrolly { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: clamp(32px, 6vw, 96px); }
.phone-sticky { position: sticky; top: 110px; align-self: start; }
.chapters { display: grid; gap: 22vh; padding-block: 6vh 20vh; }
.chapter { display: grid; gap: 14px; opacity: .45; transition: opacity .4s; }
.chapter.on { opacity: 1; }
.chapter .k { font: 700 13px var(--mono); color: var(--green); }
.chapter h3 { font-size: clamp(26px, 3vw, 36px); font-weight: 900; letter-spacing: -0.03em; line-height: 1.1; }
.chapter p { color: var(--muted); font-size: 17px; }
.device { position: relative; width: min(330px, 100%); margin: 0 auto; aspect-ratio: 9 / 18.6; border-radius: 48px; padding: 11px; background: linear-gradient(160deg, #2B3249, #090C15 42%, #1A2034); box-shadow: 0 70px 120px -40px rgba(0,0,0,.95), 0 0 0 1px rgba(255,255,255,.06) inset; }
.device::after { content: ""; position: absolute; left: 50%; top: 22px; width: 90px; height: 26px; transform: translateX(-50%); border-radius: 20px; background: #04060B; }
.dscreen { height: 100%; border-radius: 38px; overflow: hidden; background: var(--bg); padding: 54px 15px 14px; display: flex; flex-direction: column; gap: 10px; font-size: 12px; position: relative; }
.dscreen > .layer { position: absolute; inset: 54px 15px 14px; display: flex; flex-direction: column; gap: 10px; opacity: 0; transform: translateY(14px) scale(.98); transition: opacity .45s, transform .45s var(--ease); }
.dscreen > .layer.on { opacity: 1; transform: none; }
.ds-h { font-size: 24px; font-weight: 900; letter-spacing: -0.03em; line-height: 1.05; }
.ds-k { color: var(--muted); font-size: 11px; }
.ds-t { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 11px; }
.ds-t b { display: block; font-size: 16px; font-weight: 900; }
.ds-row { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.ds-row:last-child { border-bottom: 0; }

/* security */
.never { display: flex; flex-wrap: wrap; gap: 10px; }
.never span { padding: 11px 15px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); font-weight: 500; color: var(--muted); text-decoration: line-through; text-decoration-color: var(--red); text-decoration-thickness: 2px; }
.flow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: stretch; }
.flow .panel { padding: 24px; display: grid; gap: 10px; align-content: start; }
.flow .panel p { color: var(--muted); font-size: 15.5px; }
.promise-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.promise { padding: 24px; display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 14px; }
.promise p { color: var(--muted); font-size: 15.5px; margin-top: 3px; }

/* faq */
.faq { display: grid; gap: 10px; max-width: 880px; }
.faq details { border-radius: 18px; background: var(--surface); border: 1px solid var(--line); transition: border-color .2s; }
.faq details[open] { border-color: #3a4260; }
.faq summary { list-style: none; cursor: pointer; padding: 21px 24px; font-weight: 700; font-size: 17.5px; display: flex; justify-content: space-between; gap: 16px; align-items: center; }
.faq summary::-webkit-details-marker { display: none; }
.faq summary::after { content: "+"; font-size: 26px; font-weight: 400; color: var(--muted); line-height: 1; transition: transform .3s var(--ease); }
.faq details[open] summary::after { transform: rotate(45deg); }
.faq details p { padding: 0 24px 22px; color: var(--muted); max-width: 70ch; }

footer.sfoot { border-top: 1px solid var(--line-soft); padding-block: 56px 40px; color: var(--muted); font-size: 14.5px; position: relative; z-index: 1; }
.fgrid { display: grid; grid-template-columns: minmax(0, 1.6fr) repeat(3, minmax(0, 1fr)); gap: 32px; }
.fgrid h4 { margin-bottom: 12px; font-size: 14px; color: var(--ink); }
.fgrid ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; }
.fgrid a { text-decoration: none; }
.fgrid a:hover { color: var(--ink); }
.fine { margin-top: 40px; padding-top: 24px; border-top: 1px solid var(--line-soft); display: grid; gap: 8px; font-size: 13px; color: var(--subtle); }

/* ---------- APP shell ---------- */
.app { display: grid; grid-template-columns: 250px minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; padding: 22px 16px; display: flex; flex-direction: column; gap: 6px; border-right: 1px solid var(--line-soft); background: color-mix(in srgb, var(--night) 70%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.side .brand { padding: 4px 8px 20px; }
.navi { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 13px; text-decoration: none; color: var(--muted); font-weight: 500; transition: background .2s, color .2s; }
.navi:hover { color: var(--ink); background: rgba(255,255,255,.04); }
.navi[aria-current="page"] { color: var(--ink); background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); }
.side-foot { margin-top: auto; display: grid; gap: 10px; font-size: 13px; color: var(--subtle); }
.workspace { padding: 30px clamp(20px, 3.5vw, 48px) 60px; max-width: 1180px; width: 100%; min-width: 0; }
.tabs { display: none; }
.screen-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 26px; }
.screen-head h1 { font-size: clamp(30px, 4vw, 44px); font-weight: 900; letter-spacing: -0.035em; line-height: 1.05; }
.screen-head .k { color: var(--muted); font-size: 15px; margin-bottom: 4px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.box { padding: 22px; display: grid; gap: 16px; align-content: start; min-width: 0; }
.box-h { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.box-h h2 { font-size: 18px; font-weight: 700; }
.stat { padding: 20px; display: grid; gap: 4px; min-width: 0; transition: transform .3s var(--ease), border-color .2s; text-decoration: none; }
a.stat:hover { transform: translateY(-3px); border-color: #3a4260; }
.stat small { color: var(--muted); font-size: 13.5px; font-weight: 500; }
.stat b { font-size: clamp(24px, 2.8vw, 34px); font-weight: 900; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; line-height: 1.15; overflow-wrap: anywhere; }
.stat.good b { color: var(--green); }
.stat.warn b { color: var(--amber); }
.stat .hint { font-size: 13px; color: var(--subtle); }

/* wallet carousel */
.carousel { display: flex; gap: 0; overflow-x: auto; scroll-snap-type: x mandatory; padding: 30px 0 40px; margin-inline: calc(-1 * clamp(20px, 3.5vw, 48px)); padding-inline: calc(50% - min(170px, 38vw)); perspective: 1100px; scrollbar-width: none; }
.carousel::-webkit-scrollbar { display: none; }
.slot { flex: 0 0 min(340px, 76vw); scroll-snap-align: center; transform-style: preserve-3d; will-change: transform; transition: transform .1s linear; }
.slot .cardface { cursor: pointer; }
.add-slot { aspect-ratio: 85.6 / 53.98; width: 100%; border-radius: 6% / 9.5%; border: 1.5px dashed #3a4260; display: grid; place-items: center; text-decoration: none; color: var(--muted); font-weight: 700; background: rgba(255,255,255,.02); }
.add-slot:hover { color: var(--ink); border-color: var(--muted); }
.active-card { text-align: center; display: grid; gap: 6px; justify-items: center; margin-top: -8px; margin-bottom: 26px; }
.active-card h2 { font-size: 26px; font-weight: 900; letter-spacing: -0.02em; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips.center { justify-content: center; }
.chip { display: inline-flex; align-items: center; gap: 7px; min-height: 36px; padding: 0 13px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); font-size: 14px; font-weight: 500; cursor: pointer; transition: background .2s, border-color .2s, color .2s; }
.chip:hover { border-color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--cream); color: var(--night); border-color: var(--cream); font-weight: 700; }
.chip.static { cursor: default; }
.txn { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px 4px; border-bottom: 1px solid var(--line-soft); }
.txn:last-child { border-bottom: 0; }
.cico { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; }
.txn b { display: block; font-size: 15.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.txn small { color: var(--muted); font-size: 13px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.txn .amt { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.txn .amt small { text-align: right; }

/* best */
.cat-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.cat { display: grid; gap: 8px; justify-items: start; padding: 14px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; text-align: left; transition: transform .25s var(--ease), border-color .2s, background .2s; }
.cat:hover { transform: translateY(-2px); border-color: #3a4260; }
.cat[aria-pressed="true"] { border-color: var(--cream); background: var(--surface-3); box-shadow: 0 0 0 1px var(--cream) inset; }
.cat span { font-size: 14px; font-weight: 700; }
.amount { display: flex; align-items: center; gap: 8px; min-height: 66px; padding: 0 20px; border-radius: 18px; background: var(--bg); border: 1px solid var(--line); }
.amount:focus-within { border-color: var(--cream); }
.amount span { font: 700 28px "Inter", var(--font); color: var(--muted); }
.amount input { flex: 1; width: 0; min-width: 0; background: none; border: 0; outline: 0; font-size: 36px; font-weight: 900; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.rank { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 15px 16px; border-radius: 16px; background: var(--surface-2); border: 1px solid transparent; animation: rise .5s var(--ease) both; }
.rank:nth-child(2) { animation-delay: .05s; } .rank:nth-child(3) { animation-delay: .1s; } .rank:nth-child(4) { animation-delay: .15s; } .rank:nth-child(n+5) { animation-delay: .2s; }
@keyframes rise { from { transform: translateY(10px); } }
.rank.best { border-color: color-mix(in srgb, var(--green) 50%, transparent); background: linear-gradient(110deg, var(--green-bg), var(--surface-2) 70%); box-shadow: 0 20px 50px -30px rgba(111,217,164,.5); }
.pos { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; font: 700 13px var(--mono); background: var(--bg); color: var(--muted); }
.rank.best .pos { background: var(--green); color: var(--night); }
.rank b { display: block; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.why { font-size: 13px; color: var(--muted); line-height: 1.45; }
.why.cap { color: var(--amber); }
.val { font-size: 22px; font-weight: 900; white-space: nowrap; text-align: right; font-variant-numeric: tabular-nums; }
.rank.best .val { color: var(--green); }
/* best card: inputs on the left, one clear answer on the right */
.best-layout { display: grid; grid-template-columns: minmax(0, .85fr) minmax(0, 1.15fr); gap: 16px; align-items: start; }
.best-input { position: sticky; top: 20px; gap: 22px; }
.search { display: flex; align-items: center; gap: 10px; min-height: 54px; padding: 0 16px; border-radius: 16px; background: var(--bg); border: 1px solid var(--line); }
.search:focus-within { border-color: var(--cream); }
.search input { flex: 1; width: 0; min-width: 0; background: none; border: 0; outline: 0; font-size: 17px; }
.small-chips { gap: 6px; margin-top: 2px; }
.small-chips .chip { min-height: 32px; padding: 0 11px; font-size: 13px; }
.cat-row { display: flex; flex-wrap: wrap; gap: 6px; }
.cat-pill { display: inline-flex; align-items: center; gap: 7px; min-height: 36px; padding: 0 12px 0 5px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); font-size: 13.5px; font-weight: 500; cursor: pointer; }
.cat-pill .cico { width: 26px; height: 26px; border-radius: 50%; }

function rule(card, cat) { for (var i = 0; i < card.rules.length; i++) if (card.rules[i].cat === cat) return { rate: card.rules[i].rate, cap: card.rules[i].cap, source: 'category' }; return { rate: card.base, cap: undefined, source: 'base' }; }

/* The recommendation: the best card, why, how much more it earns, and a split when a cap runs out. */
function recommendation(cat, amount) {
  var list = rank(cat, amount), best = list[0], next = list[1], worst = list[list.length - 1];
  var out = { list: list, best: best, next: next, worst: worst, split: null };
  if (!best) return out;
  // If the best card's cap runs out partway, suggest paying the rest with the next card.
  if (best.limited && best.left > 0 && next) {
    var coverable = Math.floor(best.left * 100 / best.rate);
    var rest = amount - coverable;
    if (rest > 0) {
      var nextOnRest = evaluate(next.card, cat, rest).reward;
      var total = Math.round((best.left + nextOnRest) * 100) / 100;
      if (total > best.reward + 0.009) out.split = { first: best.card, firstAmt: coverable, second: next.card, secondAmt: rest, total: total };
    }
  }
  return out;
}

    $$('[data-compare]').forEach(function (b) { b.addEventListener('click', function () { ui.merchant = ''; ui.cat = b.getAttribute('data-compare'); ui.amount = Number(b.getAttribute('data-avg')); go('best'); }); });
  }
  if (r === 'import') mountImport();
  if (r === 'cards') mountCards();
}

function mountImport() {
  var err = $('#impErr');
  function fail(m) { err.textContent = m; err.hidden = !m; }
  function parse(text) {
    fail('');
    try { ui.parsed = importStatement(text, S.txns.map(function (t) { return { date: t.date, amountRupees: t.amount, merchant: t.merchant }; })); paintPreview(); }
    catch (e) { ui.parsed = null; paintPreview(); fail(e && e.message ? e.message : 'We couldn’t read that file.'); }
  }
  function paintPreview() {
    var p = $('#preview'), r = ui.parsed;
    if (!r) { p.innerHTML = '<div class="empty"><span class="big-ico" style="width:56px;height:56px;border-radius:18px;display:grid;place-items:center;background:var(--surface-2)">' + ico('import', 24) + '</span><h2 style="color:var(--ink);font-size:20px">Preview appears here</h2><p>Choose a file or use the example to see what TAPO finds.</p></div>'; return; }
    if (!r.rows.length) { p.innerHTML = '<div class="empty"><h2 style="color:var(--ink);font-size:20px">Nothing new to import</h2><p>Every row was money in, already imported, or unreadable.</p></div>'; return; }
    if (!ui.payCard || !cardById(ui.payCard)) ui.payCard = S.cards[0] ? S.cards[0].id : null;
    var total = r.rows.reduce(function (s, x) { return s + x.amountRupees; }, 0), sk = r.skipped, notes = [];
    if (sk.credits) notes.push(sk.credits + ' money in'); if (sk.duplicates) notes.push(sk.duplicates + ' already imported'); if (sk.invalid) notes.push(sk.invalid + ' unreadable'); if (sk.overLimit) notes.push(sk.overLimit + ' over limits');
    p.innerHTML = '<div class="box-h"><h2>' + r.rows.length + ' purchases found</h2><b class="num" style="font-size:20px">' + inr(total) + '</b></div>' +
      '<p class="subtle small">Columns: ' + esc(r.columns.date) + ' · ' + esc(r.columns.description) + ' · ' + esc(r.columns.amount) + (notes.length ? '. Skipped ' + notes.join(', ') + '.' : '') + '</p>' +
      '<div class="preview-rows">' + r.rows.slice(0, 8).map(function (x) { return '<div class="txn">' + catIcon(x.category) + '<div style="min-width:0"><b>' + esc(x.merchant) + '</b><small>' + CAT[x.category].label + '</small></div><div class="amt">' + inr(x.amountRupees) + '<small>' + shortDate(x.date) + '</small></div></div>'; }).join('') + (r.rows.length > 8 ? '<p class="subtle small" style="padding-top:8px">and ' + (r.rows.length - 8) + ' more</p>' : '') + '</div>' +
      (S.cards.length ? '<div class="field"><label for="payCard">Which card paid for these?</label><select class="select" id="payCard">' + S.cards.map(function (c) { return '<option value="' + esc(c.id) + '"' + (c.id === ui.payCard ? ' selected' : '') + '>' + esc(c.name) + '</option>'; }).join('') + '</select></div><button class="btn btn-primary" type="button" id="doImport">' + ico('check', 18) + ' Import ' + r.rows.length + ' purchases</button>' : '<p class="muted">Add a card first.</p><a class="btn btn-primary btn-sm" href="#cards">Add a card</a>');
    var sel = $('#payCard'); if (sel) sel.addEventListener('change', function () { ui.payCard = sel.value; });
    var b = $('#doImport'); if (b) b.addEventListener('click', function () {
      var cardId = $('#payCard').value;
      r.rows.forEach(function (x, i) { S.txns.push({ id: 'imp' + Date.now().toString(36) + i, cardId: cardId, merchant: x.merchant, category: x.category, amount: x.amountRupees, date: x.date, imported: true }); });
      S.txns = S.txns.slice(-3000); persist(); ui.parsed = null; toast(r.rows.length + ' purchases imported'); go('insights');
    });
  }
  paintPreview();
  $('#useExample').addEventListener('click', function () { parse(EXAMPLE_CSV); });
  $('#parsePaste').addEventListener('click', function () { var v = $('#paste').value; if (v.trim()) parse(v); else fail('Paste some CSV text first.'); });
  $('#file').addEventListener('change', function (e) { var f = e.target.files && e.target.files[0]; e.target.value = ''; readFile(f); });
  function readFile(f) { if (!f) return; if (f.size > MAX_IMPORT_BYTES) { fail('That file is too large. Export a shorter date range (under 2 MB).'); return; } f.text().then(parse, function () { fail('We couldn’t open that file.'); }); }
  var drop = $('#drop');
  ['dragenter', 'dragover'].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('over'); }); });
  ['dragleave', 'drop'].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('over'); }); });
  drop.addEventListener('drop', function (e) { readFile(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]); });
  var rmI = $('#rmImported'); if (rmI) rmI.addEventListener('click', function () { S.txns = S.txns.filter(function (t) { return !t.imported; }); persist(); toast('Imported purchases removed'); render(); });
  var rmE = $('#rmExamples'); if (rmE) rmE.addEventListener('click', function () { S.txns = S.txns.filter(function (t) { return !t.example; }); persist(); toast('Example activity cleared'); render(); });
}

function mountCards() {
  $('#newCard').addEventListener('click', function () { openEditor(null); });
  if (ui.openCard && cardById(ui.openCard)) { var oc = ui.openCard; ui.openCard = null; setTimeout(function () { openEditor(oc); }, 380); }
  $$('[data-edit]').forEach(function (b) { b.addEventListener('click', function () { openEditor(b.getAttribute('data-edit')); }); });
  $$('[data-del]').forEach(function (b) {
    b.addEventListener('click', function () {
      if (b.getAttribute('data-armed')) { var id = b.getAttribute('data-del'); S.cards = S.cards.filter(function (c) { return c.id !== id; }); S.txns = S.txns.filter(function (t) { return t.cardId !== id; }); persist(); toast('Card removed'); render(); return; }
      b.setAttribute('data-armed', '1'); b.textContent = 'Tap again to remove';
    });
  });
  var reset = $('#resetAll');
  reset.addEventListener('click', function () {
    if (reset.getAttribute('data-armed')) { S = fresh(); persist(); toast('Reset to example data'); render(); return; }
    reset.setAttribute('data-armed', '1'); reset.textContent = 'Tap again to erase your cards and imports';
  });
}
function openEditor(id) {
  var c = id ? cardById(id) : { name: '', last4: '', base: 1, color: COLORS[S.cards.length % COLORS.length], rules: [] };
  var draft = JSON.parse(JSON.stringify(c));
  var back = document.createElement('div'); back.className = 'dialog-back';
  var rows = ''; for (var i = 0; i < 3; i++) { var r = draft.rules[i] || {}; rows += '<div class="rule-row"><div class="field"><label for="rc' + i + '">Category ' + (i + 1) + '</label><select class="select" id="rc' + i + '"><option value="">No rule</option>' + CATS.map(function (x) { return '<option value="' + x[0] + '"' + (x[0] === r.cat ? ' selected' : '') + '>' + x[1] + '</option>'; }).join('') + '</select></div><div class="field"><label for="rr' + i + '">Rate %</label><input class="input" id="rr' + i + '" inputmode="decimal" value="' + (r.rate != null ? r.rate : '') + '"></div><div class="field"><label for="rp' + i + '">Monthly cap ₹</label><input class="input" id="rp' + i + '" inputmode="numeric" placeholder="None" value="' + (r.cap != null ? r.cap : '') + '"></div></div>'; }
  back.innerHTML = '<form class="panel dialog" role="dialog" aria-modal="true" aria-labelledby="dlgT" novalidate><div class="box-h"><h2 id="dlgT" style="font-size:22px">' + (id ? 'Edit card' : 'Add a card') + '</h2><button class="link-btn" type="button" data-close aria-label="Close">Close</button></div>' +
    '<div id="dlgPrev" style="max-width:320px;width:100%;justify-self:center"></div>' +
    '<div class="dlg-grid"><div class="field"><label for="dName">Nickname</label><input class="input" id="dName" maxlength="24" autocomplete="off" placeholder="e.g. Grocery card" value="' + esc(draft.name) + '"></div><div class="field"><label for="dLast">Last 4 digits (optional)</label><input class="input" id="dLast" inputmode="numeric" maxlength="4" autocomplete="off" value="' + esc(draft.last4 || '') + '"></div>' +
    '<div class="field"><label for="dBase">Base reward %</label><input class="input" id="dBase" inputmode="decimal" value="' + draft.base + '"></div><div class="field"><span class="lbl">Colour</span><div class="swatches" role="group" aria-label="Card colour">' + COLORS.map(function (col) { return '<button class="sw" type="button" style="--c:' + col + '" data-col="' + col + '" aria-label="Colour ' + col + '" aria-pressed="' + (col === draft.color) + '"></button>'; }).join('') + '</div></div></div>' +
    '<p class="subtle small">Categories where this card earns more (up to three).</p>' + rows +
    '<p class="err" id="dErr" role="alert" hidden></p><div class="chips"><button class="btn btn-primary" type="submit">' + (id ? 'Save changes' : 'Add card') + '</button><button class="btn btn-ghost" type="button" data-close>Cancel</button></div></form>';
  document.body.appendChild(back);
  var form = $('form', back), prev = $('#dlgPrev', back);
  function paintPrev() { draft.name = $('#dName', back).value.trim() || 'Your card'; draft.last4 = $('#dLast', back).value; prev.innerHTML = cardFace({ name: draft.name, last4: /^\d{4}$/.test(draft.last4) ? draft.last4 : '', color: draft.color, base: Number($('#dBase', back).value) || 0, rules: [] }); }
  paintPrev();
  $('#dName', back).focus();
  form.addEventListener('input', paintPrev);
  $$('.sw', back).forEach(function (s) { s.addEventListener('click', function () { draft.color = s.getAttribute('data-col'); $$('.sw', back).forEach(function (x) { x.setAttribute('aria-pressed', String(x === s)); }); paintPrev(); }); });
  function close() { back.remove(); document.removeEventListener('keydown', onKey); }
  function onKey(e) { if (e.key === 'Escape') close(); }
  document.addEventListener('keydown', onKey);
  $$('[data-close]', back).forEach(function (b) { b.addEventListener('click', close); });
  back.addEventListener('click', function (e) { if (e.target === back) close(); });
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var errEl = $('#dErr', back); function bad(m) { errEl.textContent = m; errEl.hidden = false; }
    var name = $('#dName', back).value.replace(/\s+/g, ' ').trim(), last4 = $('#dLast', back).value.trim(), base = Number(String($('#dBase', back).value).replace(',', '.'));
    if (!name) return bad('Give the card a nickname.');
    if (name.replace(/\D/g, '').length >= 8) return bad('Use a nickname, not a card number. TAPO never stores card numbers.');
    if (last4 && !/^\d{4}$/.test(last4)) return bad('Last 4 digits must be exactly four numbers, or leave it empty.');
    if (!(base >= 0 && base <= 20)) return bad('Base reward must be between 0% and 20%.');
    var rules = [], seen = {};
    for (var i = 0; i < 3; i++) {
      var cat = $('#rc' + i, back).value; if (!cat) continue;
      var rate = Number(String($('#rr' + i, back).value).replace(',', '.')), capS = $('#rp' + i, back).value.replace(/,/g, '').trim(), cap = capS === '' ? undefined : Number(capS);
      if (seen[cat]) return bad(CAT[cat].label + ' is listed twice.');
      if (!(rate >= 0 && rate <= 20) || $('#rr' + i, back).value.trim() === '') return bad('Enter a rate between 0% and 20% for ' + CAT[cat].label + '.');
      if (cap !== undefined && !(cap > 0 && cap <= 100000)) return bad('The cap for ' + CAT[cat].label + ' must be a positive amount, or leave it empty.');
      seen[cat] = 1; rules.push(cap === undefined ? { cat: cat, rate: rate } : { cat: cat, rate: rate, cap: cap });
    }
    var out = { id: id || 'c' + Date.now().toString(36), name: name, last4: last4, base: base, color: draft.color, rules: rules };
    if (id) S.cards = S.cards.map(function (x) { return x.id === id ? out : x; }); else S.cards.push(out);
    persist(); close(); toast(id ? 'Card updated' : 'Card added'); render();
  });
}

/* =====================================================================================
   Aurora background (canvas)
   ===================================================================================== */
(function aurora() {
  var cv = $('#aurora'), ctx = cv.getContext('2d'), w, h, dpr = Math.min(2, window.devicePixelRatio || 1), t = 0, raf = null;
  var blobs = [{ x: .78, y: .12, r: .55, c: '111,217,164', a: .10, s: .7 }, { x: .15, y: .3, r: .5, c: '169,155,255', a: .08, s: .5 }, { x: .55, y: .85, r: .6, c: '236,233,226', a: .05, s: .4 }];
  function size() { w = cv.clientWidth; h = cv.clientHeight; cv.width = w * dpr; cv.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
  function draw() {
    ctx.clearRect(0, 0, w, h);
    blobs.forEach(function (b, i) {
      var x = (b.x + Math.sin(t * b.s * .2 + i) * .06) * w, y = (b.y + Math.cos(t * b.s * .17 + i * 2) * .05) * h, r = b.r * Math.max(w, h);
      var g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, 'rgba(' + b.c + ',' + b.a + ')'); g.addColorStop(1, 'rgba(' + b.c + ',0)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    });
  }
  var last = 0;
  function loop(ts) { if (ts - last > 50) { t = ts / 1000; draw(); last = ts; } raf = requestAnimationFrame(loop); }
  size(); draw();
  window.addEventListener('resize', function () { size(); draw(); });
  if (!REDUCE) { raf = requestAnimationFrame(loop); document.addEventListener('visibilitychange', function () { if (document.hidden) { cancelAnimationFrame(raf); raf = null; } else if (!raf) raf = requestAnimationFrame(loop); }); }
})();

/* =====================================================================================
   Intro: scattered dots fly together into the TAPO mark, then the name sweeps in.
   Plays once per browser session; skipped with Reduce Motion; click or any key skips it.
   ===================================================================================== */
function intro() {
  if (REDUCE || !document.body.animate) return;
  var U = 4, pts = [], x, y, a;                       // mark geometry in 40-unit space, drawn at 4px per unit
  for (x = 9; x <= 27; x += 2.5) for (y = 14; y <= 20; y += 2.5) pts.push([x, y, 0]);          // crossbar (card)
  for (x = 16; x <= 20; x += 2.2) for (y = 22.5; y <= 31; y += 2.4) pts.push([x, y, 0]);       // stem
  for (a = -45; a <= 45; a += 22.5) pts.push([26 + 6 * Math.cos(a * Math.PI / 180), 17 + 6 * Math.sin(a * Math.PI / 180), 1]);       // inner wave
  for (a = -42; a <= 42; a += 14) pts.push([26.2 + 10.5 * Math.cos(a * Math.PI / 180), 17 + 10.5 * Math.sin(a * Math.PI / 180), 1]); // outer wave
  var el = document.createElement('div');
  el.className = 'intro'; el.setAttribute('role', 'presentation');
  el.innerHTML = '<div class="intro-inner"><div class="intro-stage">' +
    pts.map(function (p) { return '<i class="intro-dot' + (p[2] ? ' g' : '') + '"></i>'; }).join('') +
    '<svg class="intro-mark" viewBox="0 0 40 40" aria-hidden="true"><rect class="ring" x="1" y="1" width="38" height="38" rx="10.5" fill="none" stroke="#ECE9E2" stroke-width=".8" pathLength="520"/><rect x="8" y="13" width="20" height="8" rx="2.4" fill="#ECE9E2"/><rect x="10.5" y="15.2" width="4" height="3.2" rx=".8" fill="#D8B96A"/><rect x="15" y="19" width="6" height="13" rx="2" fill="#ECE9E2"/><path d="M30 12.5a6 6 0 0 1 0 9M33.5 9.5a10.5 10.5 0 0 1 0 15" stroke="#6FD9A4" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg></div>' +
    '<div class="intro-word">TAPO</div><div class="intro-tag">The right card, every time.</div></div><button class="intro-skip" type="button">Skip</button>';
  document.body.appendChild(el);
  var dots = $$('.intro-dot', el), timers = [];
  dots.forEach(function (d, i) {
    var p = pts[i], tx = p[0] * U, ty = p[1] * U, ang = Math.random() * Math.PI * 2, dist = 260 + Math.random() * 420;
    d.animate([
      { transform: 'translate(' + (80 + Math.cos(ang) * dist) + 'px,' + (80 + Math.sin(ang) * dist) + 'px) scale(.3)', opacity: 0 },
      { opacity: 1, offset: .25 },
      { transform: 'translate(' + tx + 'px,' + ty + 'px) scale(1)', opacity: 1 }
    ], { duration: 950 + Math.random() * 350, delay: Math.random() * 260, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'both' });
  });
  function done() { timers.forEach(clearTimeout); el.classList.add('out'); setTimeout(function () { el.remove(); }, 600); document.removeEventListener('keydown', done); }
  timers.push(setTimeout(function () { el.classList.add('mark'); }, 1450));
  timers.push(setTimeout(function () { el.classList.add('word'); }, 1850));
  timers.push(setTimeout(done, 3200));
  el.addEventListener('click', done);
  document.addEventListener('keydown', done);
}

render();
})();
</script>
