<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
  <title id="t">TAPO — NFC-triggered simulated payment demo</title>
  <desc id="d">TAPO logo with the caption: a capstone prototype. A demo NFC tag or a simulated tap starts a checkout that uses dummy data. No real money moves.</desc>
  <rect width="1200" height="360" rx="20" fill="#0A0A0B"/>
  <rect x="0.5" y="0.5" width="1199" height="359" rx="19.5" fill="none" stroke="#26262A"/>
  <g transform="translate(72 74) scale(2.2)">
    <rect width="40" height="40" rx="11" fill="#F2EFE9"/>
    <rect x="8" y="13" width="20" height="8" rx="2.4" fill="#0A0A0B"/>
    <rect x="10.5" y="15.2" width="4" height="3.2" rx=".8" fill="#C9A96A"/>
    <rect x="15" y="19" width="6" height="13" rx="2" fill="#0A0A0B"/>
    <path d="M30 12.5a6 6 0 0 1 0 9M33.5 9.5a10.5 10.5 0 0 1 0 15" stroke="#0A0A0B" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  </g>
  <text x="180" y="130" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="56" font-weight="700" letter-spacing="9" fill="#F2EFE9">TAPO</text>
  <text x="72" y="226" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="600" fill="#F2EFE9">Tap a demo tag. See a simulated checkout.</text>
  <text x="72" y="272" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#ABA8A1">Capstone prototype · dummy data only · no real money moves · no bank card is read</text>
  <g font-family="Consolas, Menlo, monospace" font-size="15" fill="#D8BF8F" letter-spacing="1.5">
    <text x="72" y="318">TAPO-DEMO:CAPSTONE-01  →  REVIEW  →  SIMULATED RESULT  →  DUMMY RECEIPT</text>
  </g>
  <g transform="translate(930 96)" stroke="#D8BF8F" stroke-width="5" stroke-linecap="round" fill="none" opacity=".85">
    <path d="M40 40a40 40 0 0 1 0 80"/>
    <path d="M68 16a74 74 0 0 1 0 128"/>
    <path d="M96 -8a108 108 0 0 1 0 176"/>
  </g>
  <rect x="868" y="122" width="56" height="108" rx="10" fill="none" stroke="#36363B" stroke-width="3"/>
  <rect x="884" y="134" width="24" height="5" rx="2.5" fill="#36363B"/>
</svg>
